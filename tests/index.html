<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J3 WorkOut — Tests</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1115;color:#e8eaf0;margin:0;padding:20px;}
  h1{font-size:20px;margin:0 0 4px;} .sub{color:#9096a8;font-size:13px;margin-bottom:16px;}
  #summary{font-size:16px;font-weight:800;margin:10px 0 16px;padding:12px 14px;border-radius:10px;background:#1b1f2a;}
  #summary.pass{color:#3ddc97;} #summary.fail{color:#ff5d6c;}
  .group{margin:14px 0 6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#9096a8;}
  .t{font-size:13px;padding:5px 0;border-bottom:1px solid #2a2f3d;}
  .t.ok::before{content:'✓ ';color:#3ddc97;font-weight:900;} .t.bad::before{content:'✗ ';color:#ff5d6c;font-weight:900;}
  .t .err{color:#ff9f5a;font-size:12px;margin-left:18px;white-space:pre-wrap;}
  iframe{position:absolute;left:-9999px;width:420px;height:900px;border:0;}
</style>
</head>
<body>
<h1>J3 WorkOut — automated tests</h1>
<div class="sub">Loads the real app in a hidden frame in <strong>test mode</strong> (separate storage — your workout data is never touched) and checks the core logic. Open this page any time after a change.</div>
<div id="summary">Running…</div>
<div id="out"></div>
<iframe id="app"></iframe>
<script>
/* ---------- tiny test harness ---------- */
const results = [];
const tests = [];
let currentGroup = '';
function group(name){ currentGroup = name; }
function test(name, fn){ tests.push({ group: currentGroup, name, fn }); }
function assert(cond, msg){ if(!cond) throw new Error(msg || 'assertion failed'); }
function eq(a, b, msg){ const A = JSON.stringify(a), B = JSON.stringify(b); if(A !== B) throw new Error((msg ? msg + ': ' : '') + 'expected ' + B + ', got ' + A); }
let W; // the app's window
function clearTestStorage(){ Object.keys(localStorage).filter(k=>k.startsWith('ironlogtest_')).forEach(k=>localStorage.removeItem(k)); }
function loadApp(){
  return new Promise(res=>{
    const f = document.getElementById('app');
    f.onload = ()=>{ W = f.contentWindow; setTimeout(res, 50); };
    f.src = '../index.html?test=1&t=' + Date.now();
  });
}
async function fresh(){ clearTestStorage(); await loadApp(); W.eval('profile.showTips=false; saveAll();'); }
// Run code inside the app's global scope (its top-level `let`s aren't on window).
function app(code){ return W.eval(code); }

/* ================= TESTS ================= */
group('Muscle database');
test('every exercise has a database entry', ()=>{
  const missing = app("exercises.filter(e=>!MUSCLE_DB[e.id]).map(e=>e.id)");
  eq(missing, []);
});
test('every database muscle key is valid', ()=>{
  const bad = app("Object.entries(MUSCLE_DB).filter(([k,v])=>v.split('|').flatMap(x=>x.slice(2).split(',')).some(m=>!MUSCLES[m])).map(e=>e[0])");
  eq(bad, []);
});
test('every exercise has at least one primary muscle', ()=>{
  eq(app("exercises.filter(e=>!exMuscles(e).P.length).map(e=>e.id)"), []);
});
test('parseMuscleSpec / muscleLoad', ()=>{
  eq(app("parseMuscleSpec('P:chest|S:tri,fdelt|T:upback')"), { P:['chest'], S:['tri','fdelt'], T:['upback'] });
  eq(app("[muscleLoad(exercises.find(e=>e.id==='bench'),'chest'), muscleLoad(exercises.find(e=>e.id==='bench'),'tri'), muscleLoad(exercises.find(e=>e.id==='bench'),'upback'), muscleLoad(exercises.find(e=>e.id==='bench'),'quads')]"), [1,0.5,0.25,0]);
});

group('Recovery-aware selection');
test('sore shoulders blocks lateral raise and DB bench, not leg press', ()=>{
  const r = app("const f={shoulders:'sore'}; ['lateralraise','dbbench','legpress'].map(id=>exConflict(exercises.find(e=>e.id===id), f).blocked)");
  eq(r, [true, true, false]);
});
test('sore only blocks primary/secondary; rest blocks tertiary too', ()=>{
  // bench: upper back is tertiary
  eq(app("exConflict(exercises.find(e=>e.id==='bench'), {back:'sore'}).blocked"), false);
  eq(app("exConflict(exercises.find(e=>e.id==='bench'), {back:'rest'}).blocked"), true);
});
test('safe alternative for DB bench with sore shoulders spares shoulders', ()=>{
  const r = app("const a = safeAlternative(exercises.find(e=>e.id==='dbbench'), 'chestPress', [], {shoulders:'sore'}); a ? [a.id, exConflict(a,{shoulders:'sore'}).blocked] : null");
  assert(r, 'expected an alternative'); eq(r[1], false, 'alternative should not be blocked');
});

group('Weight suggestions');
test('repRange parsing', ()=>{
  eq(app("[repRange('8–12'), repRange(10), repRange('12/leg'), repRange('40s')]"), [[8,12],[10,10],[12,12],[40,40]]);
});
test('readiness 5 / 4 / 3 / 2 / 1 behave as designed (earned lift)', ()=>{
  const r = app(`const ex = Object.assign({}, exercises.find(e=>e.id==='dbbench'), { workingWeight:100, increment:5, progress:'up' });
    const rx = { sets:3, reps:'8–12', rest:120 };
    [5,4,3,2,1].map(n=>{ const s = suggestFor(ex, rx, n); return [s.weight, s.sets]; })`);
  eq(r, [[110,3],[105,3],[100,3],[100,2],[90,2]]);
});
test('a Great-day jump is capped at ~10% on light weights', ()=>{
  eq(app("suggestFor(Object.assign({}, exercises.find(e=>e.id==='dbbench'), { workingWeight:50, increment:5, progress:'up' }), {sets:3,reps:'8–12',rest:120}, 5).weight"), 55);
});
test('not-earned lift only goes up on a Great day', ()=>{
  const r = app(`const ex = Object.assign({}, exercises.find(e=>e.id==='dbbench'), { workingWeight:50, increment:5, progress:'hold' });
    [5,4,3].map(n=>suggestFor(ex, {sets:3,reps:'8–12',rest:120}, n).weight)`);
  eq(r, [55,50,50]);
});
test('"too hard" backs off one step', ()=>{
  eq(app("suggestFor(Object.assign({}, exercises.find(e=>e.id==='dbbench'), { workingWeight:50, increment:5, progress:'down' }), {sets:3,reps:'8–12',rest:120}, 3).weight"), 45);
});
test('double progression: hitting the top of the range earns an increase', ()=>{
  const r = app(`const ex = Object.assign({}, exercises.find(e=>e.id==='dbbench'), { workingWeight:50 });
    updateProgressAfter(ex, [{reps:12,weight:50},{reps:12,weight:50},{reps:12,weight:50}], {reps:'8–12'}, 'right', 3); const a = ex.progress;
    updateProgressAfter(ex, [{reps:12,weight:50},{reps:9,weight:50}], {reps:'8–12'}, 'right', 3); const b = ex.progress;
    updateProgressAfter(ex, [{reps:12,weight:50}], {reps:'8–12'}, 'hard', 3); [a, b, ex.progress]`);
  eq(r, ['up','hold','down']);
});
test('a rough-day lighter session does not lower working weight', ()=>{
  eq(app(`const ex = Object.assign({}, exercises.find(e=>e.id==='dbbench'), { workingWeight:50 });
    updateProgressAfter(ex, [{reps:10,weight:45}], {reps:'8–12'}, 'right', 1); ex.workingWeight`), 50);
});

group('Plan generator');
test('spaced days → full body; back-to-back days → rotating split; 4 days → upper/lower', ()=>{
  eq(app("[chooseSplit([1,3,5]).name, chooseSplit([1,2,3]).name, chooseSplit([1,2,4,5]).name]"),
     ['Full Body A / B / C', 'Push / Pull / Legs', 'Upper / Lower']);
});
test('every generated day has 3+ exercises and fits the time budget roughly', ()=>{
  const r = app(`[30,45,60].map(m=>{ const p = buildProgram(Object.assign(defaultCoachDraft(), {goal:'hypertrophy', days:[1,3,5], minutes:m}));
    return p.days.every(d=>d.lifts.length>=3) && p.days.every(d=>parseInt(d.duration.replace(/\\D/g,''),10) <= m + 15); })`);
  eq(r, [true,true,true]);
});
test('"daily" biceps skips the day after biceps were trained', ()=>{
  const n = app("buildProgram(Object.assign(defaultCoachDraft(), {goal:'hypertrophy', days:[1,2,4,5], targets:['biceps'], targetMode:'daily'})).notes.filter(x=>/biceps/.test(x)).length");
  assert(n >= 1, 'expected at least one skipped-biceps note');
});
test('protected lower back removes deadlifts / RDLs from the plan', ()=>{
  const ids = app("buildProgram(Object.assign(defaultCoachDraft(), {goal:'hypertrophy', days:[1,3,5], protect:['lowerback']})).days.flatMap(d=>d.lifts)");
  ['deadlift','dbrdl','trapbardl','rackpull'].forEach(id=> assert(!ids.includes(id), id + ' should be excluded'));
});

group('Vacation circuit');
test('4 rounds × 5 exercises with correct rests (~22 min)', ()=>{
  eq(app("[buildVacPhases().length, buildVacPhases().filter(p=>p.type==='work').length, vacTotalSeconds()]"), [39, 20, 1300]);
});

group('Gamification');
test('first time doing an exercise = sets×10 + 50 XP discovery', ()=>{
  const r = app("const x = awardForLog(exercises.find(e=>e.id==='vup'), [{reps:10,weight:0},{reps:10,weight:0}]); [x.xp, x.firstTime]");
  eq(r, [70, true]);
});

group('Progress & records');
test('estimated 1-rep max (Epley)', ()=>{
  eq(app("[e1rm(60,10), e1rm(100,1), e1rm(100,40), e1rm(0,10)]"), [80, 100, 150, 0]);
});
test('PR timeline only counts improvements after the first session', ()=>{
  const r = app(`logs.length = 0; const t = todayStr();
    logs.push({id:'a',exerciseId:'dbbench',date:addDaysToDateStr(t,-20),sets:[{reps:10,weight:40}]});
    logs.push({id:'b',exerciseId:'dbbench',date:addDaysToDateStr(t,-10),sets:[{reps:8,weight:40}]});
    logs.push({id:'c',exerciseId:'dbbench',date:addDaysToDateStr(t,-1),sets:[{reps:10,weight:45}]});
    const ev = prEvents('dbbench'); const board = prBoard(); logs.length = 0;
    [ev.length, ev[0].kinds, board[0].isNew]`);
  eq(r, [1, ['weight','e1rm'], true]);
});

group('Smarter plan');
test('deload week: fewer sets and ~10% lighter; working weight protected', ()=>{
  const r = app(`const saved = profile.coach;
    profile.coach = { schedule:{1:'x'}, builtAt: todayStr(), firstBuiltAt: todayStr(), deloadWeekOf: mondayOf(todayStr()) };
    const ex = Object.assign({}, exercises.find(e=>e.id==='dbbench'), { workingWeight:100, increment:5, progress:'hold' });
    const s = suggestFor(ex, {sets:3,reps:'8–12',rest:120}, 3);
    updateProgressAfter(ex, [{reps:10,weight:90}], {reps:'8–12'}, 'right', 3);
    const out = [s.weight, s.sets, ex.workingWeight, isDeloadWeek()];
    profile.coach = saved; out`);
  eq(r, [90, 2, 100, true]);
});
test('automatic deload lands on every Nth plan week', ()=>{
  const r = app(`const saved = profile.coach; const t = todayStr();
    profile.coach = { schedule:{1:'x'}, builtAt:t, deloadEvery:5, firstBuiltAt: addDaysToDateStr(mondayOf(t), -28) };
    const a = [planWeekIndex(t), isDeloadWeek(t)];
    profile.coach.firstBuiltAt = addDaysToDateStr(mondayOf(t), -21); const b = [planWeekIndex(t), isDeloadWeek(t)];
    profile.coach = saved; [a, b]`);
  eq(r, [[5, true], [4, false]]);
});
test('stall detection: 3 sessions without a new best', ()=>{
  const r = app(`logs.length = 0; const t = todayStr();
    [[30,40,10],[20,45,10],[14,45,9],[7,45,10],[2,45,8]].forEach(([d,w,rp],i)=> logs.push({id:'s'+i,exerciseId:'dbbench',date:addDaysToDateStr(t,-d),sets:[{reps:rp,weight:w}]}));
    const stalled = !!stallInfo('dbbench');
    logs.push({id:'s9',exerciseId:'dbbench',date:t,sets:[{reps:10,weight:50}]});
    const recovered = !!stallInfo('dbbench'); logs.length = 0; [stalled, recovered]`);
  eq(r, [true, false]);
});
test('plan refresh is due after 8 weeks and can be snoozed', ()=>{
  const r = app(`const saved = profile.coach; const t = todayStr();
    profile.coach = { schedule:{1:'x'}, builtAt: addDaysToDateStr(t,-57) }; const a = refreshDue();
    profile.coach.refreshSnooze = addDaysToDateStr(t, 7); const b = refreshDue();
    profile.coach.builtAt = addDaysToDateStr(t,-10); profile.coach.refreshSnooze = null; const c = refreshDue();
    profile.coach = saved; [a,b,c]`);
  eq(r, [true, false, false]);
});
test('refresh cycle rotates exercise choices', ()=>{
  const r = app(`const a = Object.assign(defaultCoachDraft(), {goal:'hypertrophy', days:[1,3,5]});
    const p0 = buildProgram(Object.assign({}, a, {cycle:0})).days.flatMap(d=>d.lifts).join();
    const p1 = buildProgram(Object.assign({}, a, {cycle:1})).days.flatMap(d=>d.lifts).join(); p0 !== p1`);
  eq(r, true);
});

group('Split Trainer');
test('every split focus has options with all equipment', ()=>{
  const r = app(`const empty = []; const s = {day:'push', picks:[]};
    Object.keys(SB_FOCUS).forEach(f=>{ if(!exercises.some(ex=>SB_FOCUS[f].match(ex))) empty.push(f); }); empty`);
  eq(r, []);
});
test('signature moves land in the right muscle', ()=>{
  const r = app(`const of = id => Object.keys(SB_FOCUS).filter(f=>f!=='back' && SB_FOCUS[f].match(exercises.find(e=>e.id===id)));
    [of('skullcrusher'), of('bench'), of('lateralraise'), of('latpull'), of('row'), of('facepull'), of('hipthrust'), of('dbrdl'), of('calfraise'), of('assaultbike')]`);
  eq(r, [['triceps'],['chest'],['shoulders'],['lats'],['rows'],['reardelts'],['glutes'],['hamstrings'],['calves'],['engine']]);
});
test('5-exercise push day always covers chest, shoulders and triceps', ()=>{
  const r = app(`const s = {date:todayStr(), style:'ppl', day:'push', count:5, picks:[]};
    // Greedy user: keeps picking chest whenever allowed.
    for(let i=0;i<5;i++){ const ch = sbFocusChoices(s).filter(c=>c.allowed); const f = ch.find(c=>c.focus==='chest') ? 'chest' : ch[0].focus;
      const id = sbRecommend(f, s)[0]; s.picks.push({focus:f, exerciseId:id, sets:3, logged:true}); }
    [s.picks.filter(p=>p.focus==='chest').length, ['chest','shoulders','triceps'].every(f=>sbCovered(s,f)), new Set(s.picks.map(p=>p.exerciseId)).size]`);
  eq(r, [3, true, 5]);
});
test('upper day: 5 picks = one of each muscle (no spare slots)', ()=>{
  const r = app(`const s = {date:todayStr(), style:'ulc', day:'upper', count:5, picks:[]};
    sbFocusChoices(s).filter(c=>c.allowed).map(c=>c.focus).sort().join()`);
  eq(r, 'back,biceps,chest,shoulders,triceps');
});
test('options are 3 distinct exercises for the chosen muscle', ()=>{
  const r = app(`const s = {date:todayStr(), style:'ppl', day:'push', count:5, picks:[]}; const o = sbRecommend('triceps', s);
    [o.length, new Set(o).size, o.every(id=>exercises.find(e=>e.id===id).category==='triceps')]`);
  eq(r, [3, 3, true]);
});
test('rotation suggests the next day', ()=>{
  const r = app(`const saved = sb.history; sb.history = [{date:todayStr(), style:'ppl', day:'pull', exIds:[]}];
    const a = [sbNextDay('ppl'), sbNextDay('ulc')]; sb.history = [{date:todayStr(), style:'ppl', day:'legs', exIds:[]}]; a.push(sbNextDay('ppl')); sb.history = saved; a`);
  eq(r, ['legs', 'upper', 'push']);
});
test('sore triceps: push day skips triceps instead of getting stuck', ()=>{
  const r = app(`const c = {id:'x', date:todayStr(), feel:3, sleep:0, sore:0, recovering:{triceps:'rest'}, readiness:3}; checkins.push(c);
    const s = {date:todayStr(), style:'ppl', day:'push', count:5, picks:[]};
    const out = [sbSkippedRequired(s).includes('triceps'), sbUncovered(s).includes('triceps')]; checkins = checkins.filter(x=>x!==c); out`);
  eq(r[0], true); eq(r[1], false);
});

group('Resistance bands');
test('every band exercise has a demo, coaching cues and muscles', ()=>{
  const r = app(`exercises.filter(e=>e.equipment==='band').filter(e=>!BAND_DEMOS[e.id] || !EXERCISE_COACHING[e.id] || !exMuscles(e).P.length).map(e=>e.id)`);
  eq(r, []);
  assert(app(`exercises.filter(e=>e.equipment==='band').length`) >= 20, 'expected 20+ band exercises');
});
test('band demos render as animated SVG with the band drawn', ()=>{
  const r = app(`Object.keys(BAND_DEMOS).filter(id=>{ const s = bandDemoSvg(id); return !(s.includes('<animate') && (s.includes(BAND_COLOR))); })`);
  eq(r, []);
});
test('band circuit: 5 moves, all real band exercises, variants swap the demo', ()=>{
  const r = app(`const saved = profile.vacation; profile.vacation = {circuit:'bands'};
    const out = [vacList().length, vacList().every(v=>exercises.find(e=>e.id===vacExId(v) && e.equipment==='band'))];
    profile.vacation = {circuit:'bands', variants:{bpress:'pushup'}}; out.push(vacExId(VAC_BANDS[1]));
    profile.vacation = saved; out`);
  eq(r, [5, true, 'bandpushup']);
});
test('bands-only split days only offer band / bodyweight moves and still cover upper day', ()=>{
  const r = app(`const s = {date:todayStr(), style:'ulc', day:'upper', count:5, equip:'bands', picks:[]};
    const ok = ['chest','back','shoulders','biceps','triceps'].every(f=>sbCandidates(f, s).length && sbCandidates(f, s).every(e=>['band','bodyweight'].includes(e.equipment)));
    [ok, sbSkippedRequired(s)]`);
  eq(r, [true, []]);
});
test('video link searches for the exercise', ()=>{
  assert(app(`videoSearchUrl(exercises.find(e=>e.id==='bandrow'))`).includes('Band%20Seated%20Row'));
});
test('warm-up lives in Mobility now', ()=>{
  eq(app(`!!MOBILITY_ROUTINES.find(r=>r.id==='warmup') && !document.getElementById('view-warmup')`), true);
});

group('Band levels, search, start, vacation');
test('band level: topping the rep range suggests the next band up', ()=>{
  const r = app(`logs.length = 0; const ex = exercises.find(e=>e.id==='bandrow'); const d = addDaysToDateStr(todayStr(),-2);
    const out = [bandSuggestion(ex).level];
    logs.push({id:'b1', exerciseId:'bandrow', date:d, band:'medium', feel:'right', sets:[{reps:20,weight:0},{reps:20,weight:0},{reps:21,weight:0}]});
    out.push(bandSuggestion(ex).level, bandSuggestion(ex).up);
    logs[0].sets[2].reps = 15; out.push(bandSuggestion(ex).level);
    logs[0].feel = 'hard'; logs[0].sets[2].reps = 9; out.push(bandSuggestion(ex).level);
    logs.length = 0; out`);
  eq(r, ['light', 'heavy', true, 'medium', 'light']);
});
test('band chosen on screen is stamped on the log', ()=>{
  const r = app(`const ex = exercises.find(e=>e.id==='bandcurl'); setBandPick('bandcurl','heavy'); const a = bandStamp(ex); rememberBand(ex);
    [a, ex.bandLevel, bandStamp(exercises.find(e=>e.id==='bench'))]`);
  eq(r, ['heavy', 'heavy', undefined]);
});
test('log search matches every word across name, category and equipment', ()=>{
  const r = app(`switchView('log'); const s = document.getElementById('logSearch'); s.value = 'band row'; renderExerciseList();
    const names = [...document.querySelectorAll('#exerciseList .exercise-card .name')].map(n=>n.firstChild.textContent);
    s.value = ''; renderExerciseList(); names`);
  assert(r.includes('Band Seated Row'), 'expected Band Seated Row in ' + r.join(', '));
  assert(!r.includes('Bench Press'));
});
test('Start a Workout hub offers plan, split day and freestyle', ()=>{
  const r = app(`switchView('start'); [...document.querySelectorAll('#startMain .start-card .day-title')].map(e=>e.textContent)`);
  assert(r.some(t=>t.includes('Follow my plan')) && r.some(t=>t.includes('Build a split day')) && r.some(t=>t.includes('Freestyle')), r.join(' | '));
  eq(app(`switchView('split'); document.querySelector('#mainNav [data-group="train"] .nav-top').classList.contains('active')`), true);
});
test('vacation mode switches workouts to what you packed', ()=>{
  const r = app(`const saved = profile.vacation;
    profile.vacation = { from: todayStr(), until: addDaysToDateStr(todayStr(), 5), bands:true, circuit:'bands' };
    const a = [fsEquip().join(), sbEquip({equip:null}).join()]; sbSetup.equipTouched = false; renderSplit(); a.push(sbSetup.equip);
    profile.vacation.bands = false; a.push(fsEquip().join());
    profile.vacation = saved; sbSetup.equip = 'usual'; a`);
  eq([r[0], r[2], r[3]], ['band,bodyweight', 'bands', 'bodyweight']);
});

group('Daily habits & mobility');
test('habit streak counts consecutive logged days', ()=>{
  const r = app(`const t = todayStr(); dailies = {}; dailies[t] = {sleep:7}; dailies[addDaysToDateStr(t,-1)] = {steps:5000}; dailies[addDaysToDateStr(t,-3)] = {sleep:8};
    const n = habitStreak(); dailies = {}; n`);
  eq(r, 2);
});
test('logged sleep pre-fills the check-in', ()=>{
  const r = app(`const t = todayStr(); dailies = {}; const out = [];
    [5, 6.5, 8].forEach(h=>{ dailies[t] = {sleep:h}; out.push(sleepToCheckin()); }); dailies = {}; out`);
  eq(r, [-1, 0, 1]);
});
test('mobility suggestion follows sore areas', ()=>{
  eq(app(`const c = {id:'x', date:todayStr(), feel:3, sleep:0, sore:0, recovering:{shoulders:'sore'}, readiness:3}; checkins.push(c);
    const id = suggestedRoutine().id; checkins = checkins.filter(x=>x!==c); id`), 'shoulders');
});

group('Polish');
test('working weight falls back to your last logged top set', ()=>{
  const r = app(`logs.length = 0; const ex = Object.assign({}, exercises.find(e=>e.id==='gobletsquat')); delete ex.workingWeight;
    const a = workingWeight(ex);
    logs.push({id:'w1',exerciseId:'gobletsquat',date:addDaysToDateStr(todayStr(),-2),sets:[{reps:10,weight:25},{reps:10,weight:22.5}]});
    const b = workingWeight(ex); logs.length = 0; [a === targetForExerciseAtWeek(ex, currentWeekNumber()), b]`);
  eq(r, [true, 25]);
});
test('theme + text size apply to the page', ()=>{
  const r = app(`const saved = [profile.theme, profile.textSize]; setTheme('light'); setTextSize('large');
    const out = [document.documentElement.dataset.theme, document.documentElement.style.zoom];
    setTheme(saved[0]||'dark'); setTextSize(saved[1]||'normal'); out`);
  eq(r, ['light', '1.1']);
});

/* ================= RUNNER ================= */
(async function run(){
  await fresh();
  let lastGroup = null;
  const out = document.getElementById('out');
  for(const t of tests){
    if(t.group !== lastGroup){ const g = document.createElement('div'); g.className='group'; g.textContent = t.group; out.appendChild(g); lastGroup = t.group; }
    const row = document.createElement('div');
    try{ await t.fn(); row.className = 't ok'; row.textContent = t.name; results.push({ name:t.name, ok:true }); }
    catch(e){ row.className = 't bad'; row.innerHTML = t.name + '<div class="err">' + String(e && e.message || e).replace(/</g,'&lt;') + '</div>'; results.push({ name:t.name, ok:false, error:String(e && e.message || e) }); }
    out.appendChild(row);
  }
  clearTestStorage();
  const failed = results.filter(r=>!r.ok).length;
  const s = document.getElementById('summary');
  s.className = failed ? 'fail' : 'pass';
  s.textContent = failed ? `${failed} of ${results.length} tests failed` : `All ${results.length} tests passed`;
  window.__testResults = { done:true, failed, total: results.length, results };
})();
</script>
</body>
</html>
