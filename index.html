<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Tracker</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #3b82f6;
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --border: #333333;
      --success: #22c55e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h1, h2, h3, h4 { margin: 0 0 12px 0; }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    button.save-btn {
      background: var(--success);
      margin-top: 8px;
    }
    .header-select {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    select {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
    }
    .hidden { display: none !important; }
    .exercise-item {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }
    .exercise-item:last-child { border-bottom: none; }
    .input-group {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .input-field {
      flex: 1;
    }
    .input-field label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .input-field input {
      width: 100%;
      padding: 8px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
    }
    .minimized-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .flex-row { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <!-- SELECT WORKOUT SECTION -->
  <div id="workout-selector-card" class="card">
    <div id="full-selector">
      <h3>Select Today's Workout</h3>
      <div class="header-select">
        <select id="routine-select">
          <option value="">-- Choose a Routine --</option>
          <option value="Push">Push</option>
          <option value="Pull">Pull</option>
          <option value="Legs">Legs</option>
          <option value="Whole Body">Whole Body</option>
        </select>
        <button onclick="startWorkout()">Start Workout</button>
      </div>
    </div>
    
    <div id="minimized-selector" class="minimized-banner hidden">
      <div>
        <span style="color: var(--text-muted); font-size: 12px;">ACTIVE WORKOUT</span>
        <h3 id="active-routine-title" style="margin:0;">Push</h3>
      </div>
      <button class="secondary" style="width: auto;" onclick="toggleSelector(true)">Change</button>
    </div>
  </div>

  <!-- MAIN WORKOUT EXERCISES -->
  <div id="exercise-list-container" class="hidden">
    <div class="card">
      <h2 id="workout-heading">Exercises</h2>
      <div id="exercises-wrapper"></div>
    </div>
  </div>

  <!-- DATA BACKUP CONTROLS -->
  <div class="card">
    <h3>Data Safety</h3>
    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
      Export your logs to prevent data loss if you clear browser cache.
    </p>
    <div class="flex-row">
      <button class="secondary" onclick="exportData()">Export Backup</button>
      <button class="secondary" onclick="document.getElementById('importFile').click()">Import Backup</button>
      <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
    </div>
  </div>

  <script>
    // Default PPL & Whole Body Exercise Configurations
    const defaultRoutines = {
      "Push": [
        { id: "bench_press", name: "Bench Press", sets: 3, reps: 10, weight: 135 },
        { id: "overhead_press", name: "Overhead Press", sets: 3, reps: 8, weight: 95 },
        { id: "tricep_dips", name: "Tricep Dips", sets: 3, reps: 12, weight: 0 }
      ],
      "Pull": [
        { id: "lat_pulldown", name: "Lat Pulldown", sets: 3, reps: 12, weight: 120 },
        { id: "bent_rows", name: "Barbell Rows", sets: 3, reps: 10, weight: 135 },
        { id: "bicep_curls", name: "Bicep Curls", sets: 3, reps: 12, weight: 30 }
      ],
      "Legs": [
        { id: "squat", name: "Barbell Squat", sets: 4, reps: 8, weight: 185 },
        { id: "rdl", name: "Romanian Deadlift", sets: 3, reps: 10, weight: 155 },
        { id: "calf_raises", name: "Calf Raises", sets: 4, reps: 15, weight: 100 }
      ],
      "Whole Body": [
        { id: "pushups", name: "Push Ups", sets: 3, reps: 15, weight: 0 },
        { id: "pullups", name: "Pull Ups", sets: 3, reps: 8, weight: 0 },
        { id: "goblet_squat", name: "Goblet Squats", sets: 3, reps: 12, weight: 50 }
      ]
    };

    function getRoutines() {
      const saved = localStorage.getItem('workout_custom_defaults');
      return saved ? JSON.parse(saved) : defaultRoutines;
    }

    function startWorkout() {
      const selected = document.getElementById('routine-select').value;
      if (!selected) return alert('Please select a workout routine.');

      document.getElementById('active-routine-title').innerText = selected;
      document.getElementById('workout-heading').innerText = selected + " Exercises";
      
      toggleSelector(false);
      renderExercises(selected);
      document.getElementById('exercise-list-container').classList.remove('hidden');
    }

    function toggleSelector(showFull) {
      if (showFull) {
        document.getElementById('full-selector').classList.remove('hidden');
        document.getElementById('minimized-selector').classList.add('hidden');
      } else {
        document.getElementById('full-selector').classList.add('hidden');
        document.getElementById('minimized-selector').classList.remove('hidden');
      }
    }

    function renderExercises(routineKey) {
      const routines = getRoutines();
      const exercises = routines[routineKey] || [];
      const wrapper = document.getElementById('exercises-wrapper');
      wrapper.innerHTML = '';

      exercises.forEach((ex, idx) => {
        const exDiv = document.createElement('div');
        exDiv.className = 'exercise-item';
        exDiv.innerHTML = `
          <h4>${ex.name}</h4>
          <div class="input-group">
            <div class="input-field">
              <label>Sets</label>
              <input type="number" id="${routineKey}_sets_${idx}" value="${ex.sets}">
            </div>
            <div class="input-field">
              <label>Reps</label>
              <input type="number" id="${routineKey}_reps_${idx}" value="${ex.reps}">
            </div>
            <div class="input-field">
              <label>Weight (lbs)</label>
              <input type="number" id="${routineKey}_weight_${idx}" value="${ex.weight}">
            </div>
          </div>
          <button class="save-btn" onclick="saveNewDefaults('${routineKey}', ${idx})">Save as New Default</button>
        `;
        wrapper.appendChild(exDiv);
      });
    }

    function saveNewDefaults(routineKey, index) {
      const routines = getRoutines();
      
      const newSets = parseInt(document.getElementById(`${routineKey}_sets_${index}`).value) || 0;
      const newReps = parseInt(document.getElementById(`${routineKey}_reps_${index}`).value) || 0;
      const newWeight = parseInt(document.getElementById(`${routineKey}_weight_${index}`).value) || 0;

      if (!routines[routineKey]) routines[routineKey] = defaultRoutines[routineKey];

      routines[routineKey][index].sets = newSets;
      routines[routineKey][index].reps = newReps;
      routines[routineKey][index].weight = newWeight;

      localStorage.setItem('workout_custom_defaults', JSON.stringify(routines));
      alert(`Updated defaults for ${routines[routineKey][index].name}! These numbers will load automatically next time.`);
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localStorage));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `workout_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const fileReader = new FileReader();
      fileReader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          Object.keys(importedData).forEach(key => {
            localStorage.setItem(key, importedData[key]);
          });
          alert('Data imported successfully! Refreshing app...');
          location.reload();
        } catch (err) {
          alert('Invalid backup file format.');
        }
      };
      fileReader.readAsText(event.target.files[0]);
    }
  </script>
</body>
</html>
